
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리딩런 | 교사용 운영실</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic",sans-serif;background:#edf4ff;color:#17365f}
header{background:#2f7bf2;color:white;text-align:center;padding:24px}
h1{margin:0;font-size:34px}
main{max-width:1080px;margin:20px auto;padding:0 18px}
.card{background:white;border-radius:20px;padding:24px;margin:15px 0;box-shadow:0 5px 20px #1a579a15}
input,button,select{font:inherit;padding:13px;border-radius:11px}
input,select{border:2px solid #d4e2fa;width:100%;margin:6px 0}
button{border:0;background:#2f7bf2;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button.pause{background:#efaa37}
button.end{background:#e45c63}
button.reset{background:#667d99}
button.logout{background:#7b8da7}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions button{flex:1;min-width:120px}
#clock{font-size:76px;font-weight:bold;text-align:center;color:#2f7bf2}
#gameStatus{text-align:center;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.team{text-align:center;background:#f0f6ff;padding:25px 10px;border-radius:16px}
.team h3{margin-top:0}
.num{font-size:38px;font-weight:bold}
.meters{font-size:23px;color:#2f7bf2;font-weight:bold}
#message{color:#b8323c;font-weight:bold}
.hidden{display:none}
label{font-weight:bold}
@media(max-width:650px){.grid{grid-template-columns:1fr}#clock{font-size:58px}}
</style>
</head>
<body>
<header>
<h1>📚 READING RUN 🏃</h1>
<p>교사용 운영실 · 실시간 점수판</p>
</header>
<main>

<section class="card" id="loginBox">
<h2>🔐 교사 로그인</h2>
<label>이메일</label>
<input type="email" id="email" autocomplete="username">
<label>비밀번호</label>
<input type="password" id="password" autocomplete="current-password">
<button id="loginButton">로그인</button>
<p id="loginMessage"></p>
</section>

<div id="dashboard" class="hidden">
<section class="card">
<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
<h2>🏫 경기 장소</h2>
<button class="logout" id="logoutButton">로그아웃</button>
</div>
<select id="roomSelect">
<option value="library">도서실</option>
<option value="training_room">연수실</option>
</select>
<p>선택한 장소의 학생용 컴퓨터 3대만 제어합니다.</p>
</section>

<section class="card">
<div id="clock">15:00</div>
<p id="gameStatus">경기 정보를 불러오는 중...</p>
<div class="actions">
<button id="startButton">▶ 게임 시작</button>
<button id="pauseButton" class="pause">Ⅱ 일시정지</button>
<button id="endButton" class="end">■ 게임 종료</button>
<button id="resetButton" class="reset">↻ 초기화</button>
</div>
<p id="message"></p>
</section>

<section class="card">
<h2>🏃 실시간 달리기 기록</h2>
<div class="grid">
<div class="team">
<h3>📖 컴퓨터 1</h3>
<div class="num" id="chars1">0자</div>
<div class="meters" id="meters1">0m</div>
</div>
<div class="team">
<h3>📖 컴퓨터 2</h3>
<div class="num" id="chars2">0자</div>
<div class="meters" id="meters2">0m</div>
</div>
<div class="team">
<h3>📖 컴퓨터 3</h3>
<div class="num" id="chars3">0자</div>
<div class="meters" id="meters3">0m</div>
</div>
</div>
</section>
</div>
</main>

<script>
"use strict";

/* 학생용 index.html에 입력한 값과 동일하게 입력 */
const SUPABASE_URL = "https://zickbcluspkvmeoodcso.supabase.co/rest/v1/ ";
const SUPABASE_KEY = "sb_publishable_G88Gn9m3LL0QdKkh-VwluA_8-p_an7n
";

const client = window.supabase.createClient(
  SUPABASE_URL,SUPABASE_KEY
);
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

let room = params.get("room") === "training_room"
  ? "training_room" : "library";
let game = null;
let subscription = null;
let busy = false;
let loadVersion = 0;

$("roomSelect").value = room;

function secondsLeft() {
  if (!game) return 900;
  if (game.is_playing && game.ends_at) {
    return Math.max(0,Math.ceil(
      (new Date(game.ends_at).getTime()-Date.now())/1000
    ));
  }
  return Math.max(0,game.time_left || 0);
}
function render() {
  if (!game) return;
  const s = secondsLeft();
  $("clock").textContent =
    String(Math.floor(s/60)).padStart(2,"0") + ":" +
    String(s%60).padStart(2,"0");
  $("gameStatus").textContent =
    game.is_playing && s > 0 ? "🟢 경기 진행 중" :
    s === 0 ? "🏁 경기 종료" : "⏸ 경기 대기 / 일시정지";
  [1,2,3].forEach(i => {
    const n = game["team"+i+"_chars"] || 0;
    $("chars"+i).textContent = n.toLocaleString()+"자";
    $("meters"+i).textContent = (n*10).toLocaleString()+"m";
  });
  $("startButton").disabled = busy || s === 0 || game.is_playing;
  $("pauseButton").disabled = busy || !game.is_playing;
  $("endButton").disabled = busy || s === 0;
  $("resetButton").disabled = busy;
}
function applyGame(row, expectedRoom) {
  if (!row || expectedRoom !== room || row.id !== room) return;
  game = row;
  render();
}
async function fetchGame() {
  const requestedRoom = room;
  const {data,error} = await client.from("game_rooms")
    .select("*").eq("id",requestedRoom).single();
  if (requestedRoom !== room) return;
  if (error) $("message").textContent =
    "점수판 불러오기 오류: "+error.message;
  else applyGame(data,requestedRoom);
}
async function subscribeRoom() {
  const version = ++loadVersion;
  if (subscription) {
    await client.removeChannel(subscription);
    subscription = null;
  }
  if (version !== loadVersion) return;
  const subscribedRoom = room;
  subscription = client.channel(
    "teacher-"+subscribedRoom+"-"+Date.now()
  ).on("postgres_changes",{
    event:"UPDATE",
    schema:"public",
    table:"game_rooms",
    filter:"id=eq."+subscribedRoom
  }, payload => applyGame(payload.new,subscribedRoom)).subscribe();
  await fetchGame();
}
async function control(action) {
  if (busy) return;
  const labels = {
    start:"경기를 시작",
    pause:"경기를 일시정지",
    end:"경기를 종료",
    reset:"시간과 점수를 모두 초기화"
  };
  if (action === "end" || action === "reset") {
    if (!confirm(
      (room==="library"?"도서실":"연수실")+" 경기를 "+
      labels[action]+"할까요?"
    )) return;
  }
  busy = true;
  $("message").textContent = "";
  render();
  const targetRoom = room;
  const {data,error} = await client.rpc("rr_control",{
    p_room:targetRoom,p_action:action
  });
  busy = false;
  if (error) {
    $("message").textContent = "명령 실행 오류: "+error.message;
  } else {
    applyGame(data,targetRoom);
    $("message").textContent = "명령이 적용되었습니다.";
  }
  render();
}
async function login() {
  $("loginMessage").textContent = "로그인 중...";
  const {error} = await client.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if (error) {
    $("loginMessage").textContent =
      "로그인 실패: "+error.message;
    return;
  }
  await showDashboard();
}
async function showDashboard() {
  $("loginBox").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  await subscribeRoom();
}
$("loginButton").onclick = login;
$("password").addEventListener("keydown",e => {
  if(e.key==="Enter") login();
});
$("startButton").onclick = () => control("start");
$("pauseButton").onclick = () => control("pause");
$("endButton").onclick = () => control("end");
$("resetButton").onclick = () => control("reset");
$("roomSelect").onchange = async e => {
  room = e.target.value;
  game = null;
  $("clock").textContent = "15:00";
  $("gameStatus").textContent = "불러오는 중...";
  $("message").textContent = "";
  await subscribeRoom();
};
$("logoutButton").onclick = async () => {
  await client.auth.signOut();
  if(subscription) await client.removeChannel(subscription);
  location.reload();
};

if(SUPABASE_URL.includes("여기에_") ||
   SUPABASE_KEY.includes("여기에_")) {
  $("loginMessage").textContent =
    "코드 상단에 API URL과 Publishable key를 입력하세요.";
} else {
  client.auth.getSession().then(({data}) => {
    if(data.session) showDashboard();
  });
  setInterval(() => {
    if(!$("dashboard").classList.contains("hidden")) render();
  },500);
  setInterval(() => {
    if(!$("dashboard").classList.contains("hidden")) fetchGame();
  },5000);
}
</script>
</body>
</html>
