<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 AI 리딩런</title>
<style>
* { box-sizing: border-box; }

/* 🎨 화면 전체 요소를 치우침 없이 완벽하게 정중앙에 고정하는 스타일 */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  background: #2f7bf2;
  overflow-x: hidden;
}

body {
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  color: white;
  text-align: center;
  display: flex;
  justify-content: center; /* 가로 정중앙 */
  align-items: center;     /* 세로 정중앙 */
  padding: 20px 14px;
}

.game-wrapper {
  width: 100%;
  max-width: 900px;
  margin: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.main-title {
  font-size: clamp(42px, 7vw, 65px);
  font-weight: 900;
  margin: 0;
  text-shadow: 3px 4px #1a52b8;
}

.eng-title {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: 3px;
  margin: 5px 0 12px;
}

.subtitle {
  display: inline-block;
  background: #245fc1;
  color: #ffeb3b;
  border-radius: 30px;
  padding: 10px 22px;
  font-weight: bold;
  font-size: 18px;
}

.dashboard {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 20px 0 12px;
}

#turn-notice {
  background: white;
  color: #ef694c;
  padding: 10px 16px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
}

#timer {
  font-size: 30px;
  font-weight: 900;
}

.track-container {
  position: relative;
  width: 100%;
  height: 155px;
  background: #ff7e54;
  border-top: 7px solid #4ade80;
  border-bottom: 7px solid #1a52b8;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 7px 18px #174aa0;
}

.track-lane {
  position: absolute;
  width: 100%;
  top: 50%;
  border-top: 3px dashed #ffffff99;
}

.runner-group {
  position: absolute;
  left: 4%;
  top: 40px;
  display: flex;
  gap: 14px;
  transition: left .5s ease;
}

.book-character {
  width: 48px;
  height: 62px;
  border-radius: 7px;
  border-left: 6px solid #0003;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  box-shadow: 3px 4px 5px #0003;
}

.char-red { background: #ef4444; }
.char-yellow { background: #facc15; }
.char-green { background: #4ade80; }

.running .book-character {
  animation: bounce .32s infinite alternate;
}

.running .char-yellow { animation-delay: .1s; }
.running .char-green { animation-delay: .2s; }

@keyframes bounce {
  from { transform: translateY(0) rotate(-4deg); }
  to { transform: translateY(-13px) rotate(4deg); }
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 20px 0;
}

button {
  border: 0;
  border-radius: 40px;
  padding: 13px 24px;
  font-size: 19px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 5px 10px #0002;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#start-btn {
  background: #4ade80;
  color: #12492c;
  border: 3px solid white;
  font-size: 24px;
}

#next-btn { background: #ffeb3b; color: #333; }
#restart-btn { background: white; color: #2f7bf2; }

.settings {
  background: #ffffff20;
  padding: 14px;
  border-radius: 14px;
  width: 100%;
  margin-top: 15px;
}

select {
  font-size: 18px;
  padding: 8px;
  border-radius: 8px;
  border: 0;
  margin-left: 8px;
}

#reading-panel {
  width: 100%;
  display: none;
}

.poem-header {
  margin-top: 12px;
  font-size: 21px;
  font-weight: bold;
}

#text-container {
  width: 100%;
  min-height: 260px;
  max-height: 48vh;
  overflow-y: auto;
  margin: 15px auto;
  padding: 30px;
  background: white;
  color: #333;
  border-radius: 16px;
  font-size: clamp(24px, 3.4vw, 34px);
  line-height: 1.9;
  text-align: center;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  box-shadow: 0 8px 20px #0002;
}

.word { color: #777; }
.word.done { color: #16834b; font-weight: bold; }
.word.current {
  background: #fff200;
  color: black;
  border-radius: 5px;
}

#status {
  font-size: 16px;
  margin: 10px 0;
  color: #fff4b5;
  font-weight: bold;
}

#result-box {
  display: none;
  width: 100%;
  background: white;
  color: #2464c8;
  border-radius: 16px;
  padding: 28px;
  margin-top: 20px;
  font-size: 27px;
  font-weight: bold;
}

.footer-banner {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.info-tag {
  background: white;
  color: #2f7bf2;
  padding: 8px 14px;
  border-radius: 25px;
  font-size: 13px;
  font-weight: bold;
}

@media (max-width: 600px) {
  .dashboard { justify-content: center; }
  .track-container { height: 130px; }
  .runner-group { transform: scale(.75); transform-origin: left center; }
  #text-container { padding: 20px 14px; }
}
</style>
</head>

<body>
<div class="game-wrapper">

  <header>
    <h1 class="main-title">리딩런</h1>
    <div class="eng-title">READING RUN</div>
    <div class="subtitle">우리 반 릴레이 낭독 챌린지 🏃</div>
  </header>

  <div class="dashboard">
    <div id="turn-notice">📢 게임을 시작해 주세요!</div>
    <div id="timer">제한시간 15:00</div>
  </div>

  <div class="track-container">
    <div class="track-lane"></div>
    <div class="runner-group" id="runners">
      <div class="book-character char-red">😆</div>
      <div class="book-character char-yellow">😀</div>
      <div class="book-character char-green">😊</div>
    </div>
  </div>

  <div class="settings" id="settings">
    <label for="team-size">참가 학생 수</label>
    <select id="team-size">
      <option value="1">1명</option>
      <option value="2">2명</option>
      <option value="3">3명</option>
      <option value="4">4명</option>
      <option value="5">5명</option>
      <option value="6">6명</option>
      <option value="7">7명</option>
      <option value="8">8명</option>
      <option value="9" selected>9명</option>
    </select>
  </div>

  <div class="controls">
    <button id="start-btn">🏁 게임 시작!</button>
    <button id="next-btn" hidden>➡️ 이 연 완료 · 다음 차례</button>
    <button id="restart-btn" hidden>🔄 새 게임</button>
  </div>

  <div id="reading-panel">
    <div class="poem-header" id="poem-header"></div>
    <div id="text-container"></div>
    <div id="status" aria-live="polite"></div>
  </div>

  <div id="result-box"></div>

  <div class="footer-banner">
    <div class="info-tag">2026 제10회 연가 책잔치</div>
    <div class="info-tag">도서실 · 연수실</div>
  </div>

</div>

<script>
"use strict";
