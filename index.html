<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 AI 리딩런</title>
<style>
* { box-sizing: border-box; }

/* 🎨 화면 전체 요소를 치우침 없이 완벽하게 정중앙에 고정하는 스타일 */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  background: #2f7bf2;
  overflow-x: hidden;
}

body {
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  color: white;
  text-align: center;
  display: flex;
  justify-content: center; /* 가로 정중앙 */
  align-items: center;     /* 세로 정중앙 */
  padding: 20px 14px;
}

.game-wrapper {
  width: 100%;
  max-width: 900px;
  margin: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.main-title {
  font-size: clamp(42px, 7vw, 65px);
  font-weight: 900;
  margin: 0;
  text-shadow: 3px 4px #1a52b8;
}

.eng-title {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: 3px;
  margin: 5px 0 12px;
}

.subtitle {
  display: inline-block;
  background: #245fc1;
  color: #ffeb3b;
  border-radius: 30px;
  padding: 10px 22px;
  font-weight: bold;
  font-size: 18px;
}

.dashboard {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 20px 0 12px;
}

#turn-notice {
  background: white;
  color: #ef694c;
  padding: 10px 16px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
}

#timer {
  font-size: 30px;
  font-weight: 900;
}

.track-container {
  position: relative;
  width: 100%;
  height: 155px;
  background: #ff7e54;
  border-top: 7px solid #4ade80;
  border-bottom: 7px solid #1a52b8;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 7px 18px #174aa0;
}

.track-lane {
  position: absolute;
  width: 100%;
  top: 50%;
  border-top: 3px dashed #ffffff99;
}

.runner-group {
  position: absolute;
  left: 4%;
  top: 40px;
  display: flex;
  gap: 14px;
  transition: left .5s ease;
}

.book-character {
  width: 48px;
  height: 62px;
  border-radius: 7px;
  border-left: 6px solid #0003;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  box-shadow: 3px 4px 5px #0003;
}

.char-red { background: #ef4444; }
.char-yellow { background: #facc15; }
.char-green { background: #4ade80; }

.running .book-character {
  animation: bounce .32s infinite alternate;
}

.running .char-yellow { animation-delay: .1s; }
.running .char-green { animation-delay: .2s; }

@keyframes bounce {
  from { transform: translateY(0) rotate(-4deg); }
  to { transform: translateY(-13px) rotate(4deg); }
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 20px 0;
}

button {
  border: 0;
  border-radius: 40px;
  padding: 13px 24px;
  font-size: 19px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 5px 10px #0002;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#start-btn {
  background: #4ade80;
  color: #12492c;
  border: 3px solid white;
  font-size: 24px;
}

#next-btn { background: #ffeb3b; color: #333; }
#restart-btn { background: white; color: #2f7bf2; }

.settings {
  background: #ffffff20;
  padding: 14px;
  border-radius: 14px;
  width: 100%;
  margin-top: 15px;
}

select {
  font-size: 18px;
  padding: 8px;
  border-radius: 8px;
  border: 0;
  margin-left: 8px;
}

#reading-panel {
  width: 100%;
  display: none;
}

.poem-header {
  margin-top: 12px;
  font-size: 21px;
  font-weight: bold;
}

#text-container {
  width: 100%;
  min-height: 260px;
  max-height: 48vh;
  overflow-y: auto;
  margin: 15px auto;
  padding: 30px;
  background: white;
  color: #333;
  border-radius: 16px;
  font-size: clamp(24px, 3.4vw, 34px);
  line-height: 1.9;
  text-align: center;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  box-shadow: 0 8px 20px #0002;
}

.word { color: #777; }
.word.done { color: #16834b; font-weight: bold; }
.word.current {
  background: #fff200;
  color: black;
  border-radius: 5px;
}

#status {
  font-size: 16px;
  margin: 10px 0;
  color: #fff4b5;
  font-weight: bold;
}

#result-box {
  display: none;
  width: 100%;
  background: white;
  color: #2464c8;
  border-radius: 16px;
  padding: 28px;
  margin-top: 20px;
  font-size: 27px;
  font-weight: bold;
}

.footer-banner {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.info-tag {
  background: white;
  color: #2f7bf2;
  padding: 8px 14px;
  border-radius: 25px;
  font-size: 13px;
  font-weight: bold;
}

@media (max-width: 600px) {
  .dashboard { justify-content: center; }
  .track-container { height: 130px; }
  .runner-group { transform: scale(.75); transform-origin: left center; }
  #text-container { padding: 20px 14px; }
}
</style>
</head>

<body>
<div class="game-wrapper">

  <header>
    <h1 class="main-title">리딩런</h1>
    <div class="eng-title">READING RUN</div>
    <div class="subtitle">우리 반 릴레이 낭독 챌린지 🏃</div>
  </header>

  <div class="dashboard">
    <div id="turn-notice">📢 게임을 시작해 주세요!</div>
    <div id="timer">제한시간 15:00</div>
  </div>

  <div class="track-container">
    <div class="track-lane"></div>
    <div class="runner-group" id="runners">
      <div class="book-character char-red">😆</div>
      <div class="book-character char-yellow">😀</div>
      <div class="book-character char-green">😊</div>
    </div>
  </div>

  <div class="settings" id="settings">
    <label for="team-size">참가 학생 수</label>
    <select id="team-size">
      <option value="1">1명</option>
      <option value="2">2명</option>
      <option value="3">3명</option>
      <option value="4">4명</option>
      <option value="5">5명</option>
      <option value="6">6명</option>
      <option value="7">7명</option>
      <option value="8">8명</option>
      <option value="9" selected>9명</option>
    </select>
  </div>

  <div class="controls">
    <button id="start-btn">🏁 게임 시작!</button>
    <button id="next-btn" hidden>➡️ 이 연 완료 · 다음 차례</button>
    <button id="restart-btn" hidden>🔄 새 게임</button>
  </div>

  <div id="reading-panel">
    <div class="poem-header" id="poem-header"></div>
    <div id="text-container"></div>
    <div id="status" aria-live="polite"></div>
  </div>

  <div id="result-box"></div>

  <div class="footer-banner">
    <div class="info-tag">2026 제10회 연가 책잔치</div>
    <div class="info-tag">도서실 · 연수실</div>
  </div>

</div>

<script>
"use strict";

/* ===== 리딩런 게임 실행 코드 ===== */

const $ = id => document.getElementById(id);

const startBtn = $("start-btn");
const nextBtn = $("next-btn");
const restartBtn = $("restart-btn");
const readingPanel = $("reading-panel");
const textContainer = $("text-container");
const poemHeader = $("poem-header");
const statusBox = $("status");
const resultBox = $("result-box");
const turnNotice = $("turn-notice");
const timerBox = $("timer");
const runners = $("runners");
const teamSize = $("team-size");

/*
 * 아래 poems 배열에 사용할 시를 추가하세요.
 * 각 항목의 title은 제목, text는 낭독할 본문입니다.
 * 지금은 기능 확인용 예시 문장 3개가 들어 있습니다.
 */
const poems = [
  {
    title: "연습 글 1",
    text: "책을 펼치면 새로운 세상이 열려요.\n우리 함께 소리 내어 읽어요."
  },
  {
    title: "연습 글 2",
    text: "따뜻한 말 한마디가 친구의 마음을 환하게 밝혀요."
  },
  {
    title: "연습 글 3",
    text: "오늘도 한 걸음씩 즐겁게 달려요.\n책 속에서 멋진 이야기를 만나요."
  }
];

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;
let listening = false;
let gameStarted = false;
let gameFinished = false;
let remainingSeconds = 900;
let timerInterval = null;

let currentPoemIndex = 0;
let currentStudent = 1;
let studentCount = 9;
let totalCharacters = 0;
let recognizedText = "";
let finalizedTranscript = "";
let currentText = "";
let lastRecognitionError = "";

function countCharacters(text) {
  return Array.from(
    (text || "").replace(/\s/g, "")
  ).length;
}

function normalizeText(text) {
  return (text || "")
    .replace(/[^가-힣a-zA-Z0-9]/g, "")
    .toLowerCase();
}

function updateTimer() {
  const minutes = Math.floor(remainingSeconds / 60);
  const seconds = remainingSeconds % 60;

  timerBox.textContent =
    "제한시간 " +
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0");
}

function updateRunner() {
  const maxCharacters = 1200;
  const progress = Math.min(
    totalCharacters / maxCharacters,
    1
  );

  runners.style.left =
    (4 + progress * 72) + "%";

  if (gameStarted && !gameFinished) {
    runners.classList.add("running");
  } else {
    runners.classList.remove("running");
  }
}

function setStatus(message) {
  statusBox.textContent = message;
}

function renderText() {
  textContainer.textContent = currentText;
}

function showCurrentPoem() {
  if (!poems.length) {
    setStatus("등록된 낭독 글이 없습니다.");
    return;
  }

  const poem = poems[currentPoemIndex % poems.length];

  currentText = poem.text;
  recognizedText = "";
  finalizedTranscript = "";

  poemHeader.textContent =
    "📖 " + poem.title;

  renderText();

  turnNotice.textContent =
    "📢 " + currentStudent +
    "번 학생 낭독 차례!";

  setStatus("🎤 마이크를 준비하고 있습니다.");
}

function stopRecognition() {
  listening = false;

  if (recognition) {
    try {
      recognition.abort();
    } catch (error) {
      console.warn(error);
    }
  }
}

function startRecognition() {
  if (!SpeechRecognition) {
    setStatus(
      "⚠️ 이 브라우저는 음성인식을 지원하지 않습니다. Chrome에서 열어 주세요."
    );
    return;
  }

  stopRecognition();

  const instance = new SpeechRecognition();
  recognition = instance;

  instance.lang = "ko-KR";
  instance.continuous = true;
  instance.interimResults = true;
  instance.maxAlternatives = 1;

  lastRecognitionError = "";

  instance.onstart = () => {
    if (recognition !== instance) return;

    listening = true;
    setStatus("🎤 듣고 있어요! 글을 또박또박 읽어 주세요.");
  };

  instance.onresult = event => {
    if (
      recognition !== instance ||
      !gameStarted ||
      gameFinished
    ) return;

    let interim = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {
      const transcript =
        event.results[i][0].transcript || "";

      if (event.results[i].isFinal) {
        finalizedTranscript += transcript + " ";
      } else {
        interim += transcript;
      }
    }

    recognizedText = finalizedTranscript + interim;

    setStatus(
      "🎤 음성인식 중 · 인식된 글자 " +
      countCharacters(recognizedText) + "자"
    );
  };

  instance.onerror = event => {
    if (recognition !== instance) return;

    lastRecognitionError = event.error || "";

    if (
      event.error === "not-allowed" ||
      event.error === "service-not-allowed"
    ) {
      setStatus(
        "⚠️ 마이크 권한이 차단되었습니다. 주소창 옆에서 마이크를 허용해 주세요."
      );
    } else if (event.error === "no-speech") {
      setStatus(
        "🎤 목소리가 감지되지 않았어요. 다시 읽어 주세요."
      );
    } else {
      setStatus(
        "⚠️ 음성인식 오류: " + event.error
      );
    }
  };

  instance.onend = () => {
    if (recognition !== instance) return;

    listening = false;

    if (
      gameStarted &&
      !gameFinished &&
      lastRecognitionError !== "not-allowed" &&
      lastRecognitionError !== "service-not-allowed"
    ) {
      setStatus(
        "🎤 음성인식이 멈췄어요. 다시 연결합니다."
      );

      setTimeout(() => {
        if (
          gameStarted &&
          !gameFinished &&
          recognition === instance
        ) {
          startRecognition();
        }
      }, 700);
    }
  };

  try {
    instance.start();
  } catch (error) {
    console.error(error);
    setStatus(
      "⚠️ 마이크를 시작하지 못했습니다. Chrome의 마이크 권한을 확인해 주세요."
    );
  }
}

function calculateTurnScore() {
  const target = normalizeText(currentText);
  const spoken = normalizeText(recognizedText);

  if (!target || !spoken) return 0;

  /*
   * 낭독 글과 인식 결과에 공통으로 등장하는
   * 글자 수를 기준으로 간단하게 점수를 계산합니다.
   * 정확한 낭독 평가 알고리즘은 아닙니다.
   */
  const available = new Map();

  for (const char of target) {
    available.set(
      char,
      (available.get(char) || 0) + 1
    );
  }

  let matched = 0;

  for (const char of spoken) {
    const left = available.get(char) || 0;

    if (left > 0) {
      matched++;
      available.set(char, left - 1);
    }
  }

  return matched;
}

function completeTurn() {
  if (!gameStarted || gameFinished) return;

  stopRecognition();

  const earned = calculateTurnScore();
  totalCharacters += earned;

  updateRunner();

  return earned;
}

function nextTurn() {
  if (!gameStarted || gameFinished) return;

  const earned = completeTurn();

  currentStudent++;

  if (currentStudent > studentCount) {
    currentStudent = 1;
  }

  currentPoemIndex++;

  showCurrentPoem();

  setStatus(
    "✅ 이전 차례 +" +
    (earned * 10) +
    "m · 다음 학생 준비!"
  );

  startRecognition();
}

function finishGame() {
  if (gameFinished) return;

  if (gameStarted) {
    completeTurn();
  }

  gameStarted = false;
  gameFinished = true;

  clearInterval(timerInterval);
  timerInterval = null;

  stopRecognition();
  updateRunner();

  readingPanel.style.display = "none";
  nextBtn.hidden = true;
  restartBtn.hidden = false;

  turnNotice.textContent =
    "🏁 리딩런 종료!";

  resultBox.style.display = "block";
  resultBox.textContent =
    "🏆 최종 기록: " +
    (totalCharacters * 10).toLocaleString() +
    "m";
}

function startGame() {
  if (gameStarted) return;

  if (!SpeechRecognition) {
    alert(
      "이 브라우저에서는 음성인식이 지원되지 않습니다. Chrome을 사용해 주세요."
    );
    return;
  }

  gameStarted = true;
  gameFinished = false;

  studentCount = Number(teamSize.value) || 9;
  currentStudent = 1;
  currentPoemIndex = 0;
  totalCharacters = 0;
  remainingSeconds = 900;

  startBtn.hidden = true;
  nextBtn.hidden = false;
  restartBtn.hidden = true;

  $("settings").style.display = "none";
  readingPanel.style.display = "block";
  resultBox.style.display = "none";

  updateTimer();
  updateRunner();
  showCurrentPoem();

  startRecognition();

  clearInterval(timerInterval);

  timerInterval = setInterval(() => {
    if (!gameStarted || gameFinished) return;

    remainingSeconds--;
    updateTimer();

    if (remainingSeconds <= 0) {
      finishGame();
    }
  }, 1000);
}

function resetGame() {
  clearInterval(timerInterval);
  timerInterval = null;

  stopRecognition();

  gameStarted = false;
  gameFinished = false;

  remainingSeconds = 900;
  currentStudent = 1;
  currentPoemIndex = 0;
  totalCharacters = 0;
  recognizedText = "";
  finalizedTranscript = "";

  startBtn.hidden = false;
  nextBtn.hidden = true;
  restartBtn.hidden = true;

  $("settings").style.display = "block";
  readingPanel.style.display = "none";
  resultBox.style.display = "none";

  turnNotice.textContent =
    "📢 게임을 시작해 주세요!";

  updateTimer();
  updateRunner();
}

startBtn.addEventListener("click", startGame);
nextBtn.addEventListener("click", nextTurn);
restartBtn.addEventListener("click", resetGame);

updateTimer();
updateRunner();

</script>
</body>
</html>
