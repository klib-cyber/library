
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리딩런 | 학생용</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic",sans-serif;background:#eaf3ff;color:#17365f}
header{background:#2f7bf2;color:white;padding:22px;text-align:center}
h1{margin:0;font-size:38px}
header p{margin:8px 0 0}
main{max-width:1000px;margin:auto;padding:20px}
.card{background:white;border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 5px 18px #174b8b16}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
select,button{font:inherit;padding:12px 17px;border-radius:12px}
select{border:2px solid #bad5ff;background:white}
button{border:0;background:#2f7bf2;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button.secondary{background:#627fa7}
button.orange{background:#f29b37}
.big{font-size:29px;font-weight:bold}
#timer{color:#e36c25}
#sentence{font-size:32px;line-height:1.9;min-height:145px;word-break:keep-all}
.done{background:#ffe45c;border-radius:4px}
#status{color:#466789;font-weight:bold}
.track{height:18px;background:#e6efff;border-radius:20px;overflow:hidden}
.bar{height:100%;background:#2f7bf2;width:0%;transition:width .4s}
.team{margin:15px 0}
.teamhead{display:flex;justify-content:space-between;margin-bottom:7px;font-weight:bold}
small{color:#667d98}
#message{color:#c0392b;font-weight:bold}
@media(max-width:600px){h1{font-size:30px}#sentence{font-size:25px}.big{font-size:24px}}
</style>
</head>
<body>
<header>
<h1>📚 READING RUN 🏃</h1>
<p>책을 읽고 함께 달려요!</p>
</header>
<main>
<section class="card">
<div class="row">
<div>
<strong id="roomName">도서실</strong> ·
<strong id="teamName">컴퓨터 1</strong>
</div>
<div class="big" id="timer">15:00</div>
</div>
<p id="status">교사의 시작을 기다리고 있어요.</p>
</section>

<section class="card">
<div class="row">
<div>
<label for="poemSelect">읽을 글 선택</label>
<select id="poemSelect"></select>
</div>
<div>문장 <strong id="progress">1 / 1</strong></div>
</div>
<div id="sentence"></div>
<div class="row">
<button id="micButton" disabled>🎤 낭독 시작</button>
<button id="nextButton" class="orange" disabled>다음 문장 →</button>
<button id="restartButton" class="secondary">글 처음부터</button>
</div>
<p><small>읽은 부분은 노란색으로 표시돼요. 문장을 다 읽으면 자동으로 넘어갑니다.</small></p>
<p id="message"></p>
</section>

<section class="card">
<div class="row">
<div>내가 인식한 글자 수</div>
<div class="big"><span id="myChars">0</span>자</div>
</div>
<h3>🏃 실시간 달리기</h3>
<div id="teams"></div>
<p><small>인식한 글자 1자 = 10m · 점수는 교사가 경기를 시작한 뒤 기록됩니다.</small></p>
</section>
</main>

<script>
"use strict";

/* 아래 두 줄만 본인의 Supabase 값으로 교체 */
const SUPABASE_URL = "여기에_API_URL";
const SUPABASE_KEY = "여기에_PUBLISHABLE_KEY";

/*
 * 행사에서 사용할 수 있도록 허락받은 글을 여기에 추가하세요.
 * 각 글은 줄바꿈이나 마침표·물음표·느낌표를 기준으로 나뉩니다.
 */
const READINGS = [
  {
    title: "연습 글 1",
    text: "파란 하늘 아래 책을 펼쳐요.\n우리 모두 즐겁게 읽어요.\n한 글자씩 힘차게 달려요."
  },
  {
    title: "연습 글 2",
    text: "작은 마음이 모여 큰 힘이 돼요.\n친구의 이야기를 귀 기울여 들어요.\n오늘도 함께 책 속으로 떠나요."
  }
];

const params = new URLSearchParams(location.search);
const room = params.get("room") === "training_room"
  ? "training_room" : "library";
const teamParam = Number(params.get("team"));
const team = [1,2,3].includes(teamParam) ? teamParam : 1;

const $ = id => document.getElementById(id);
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let game = null;
let sentences = [];
let sentenceIndex = 0;
let confirmed = "";
let interim = "";
let recognition = null;
let listening = false;
let requestedListening = false;
let ownChars = 0;
let busyAdvance = false;
let scoreQueue = [];
let sendingScore = false;
let currentEpoch = 0;
let activeRecognitionEpoch = 0;

$("roomName").textContent = room === "library" ? "📚 도서실" : "📚 연수실";
$("teamName").textContent = "컴퓨터 " + team;

function normalize(s) {
  return (s || "").replace(/[^가-힣a-zA-Z0-9]/g, "").toLowerCase();
}
function charCount(s) {
  return normalize(s).length;
}
function escapeHTML(s) {
  return s.replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])
  );
}
function splitSentences(text) {
  return (text.match(/[^.!?\n]+[.!?]?/g) || [])
    .map(s => s.trim()).filter(Boolean);
}
function gameSeconds() {
  if (!game) return 900;
  if (game.is_playing && game.ends_at) {
    return Math.max(0, Math.ceil(
      (new Date(game.ends_at).getTime() - Date.now()) / 1000
    ));
  }
  return Math.max(0, game.time_left || 0);
}
function canPlay() {
  return !!game && game.is_playing && gameSeconds() > 0;
}
function setMessage(msg) {
  $("message").textContent = msg || "";
}
function loadReading() {
  sentences = splitSentences(READINGS[Number($("poemSelect").value)].text);
  sentenceIndex = 0;
  confirmed = "";
  interim = "";
  renderSentence();
}
function renderSentence() {
  const target = sentences[sentenceIndex] || "";
  const heard = normalize(confirmed + interim);
  let highlighted = 0;
  let k = 0;
  for (const ch of target) {
    if (normalize(ch)) {
      if (k >= heard.length) break;
      k++;
    }
    highlighted++;
  }
  $("sentence").innerHTML =
    '<span class="done">' + escapeHTML(target.slice(0, highlighted)) +
    '</span>' + escapeHTML(target.slice(highlighted));
  $("progress").textContent =
    (sentenceIndex + 1) + " / " + sentences.length;
}
function renderTeams() {
  if (!game) return;
  const scores = [game.team1_chars,game.team2_chars,game.team3_chars];
  const max = Math.max(1, ...scores);
  $("teams").innerHTML = scores.map((v,i) => `
    <div class="team">
      <div class="teamhead">
        <span>${i+1 === team ? "📖 " : "🏃 "}컴퓨터 ${i+1}</span>
        <span>${v || 0}자 · ${(v || 0)*10}m</span>
      </div>
      <div class="track"><div class="bar"
        style="width:${Math.max(0,(v || 0)/max*100)}%"></div></div>
    </div>
  `).join("");
}
function renderGame() {
  if (!game) return;
  const s = gameSeconds();
  $("timer").textContent =
    String(Math.floor(s/60)).padStart(2,"0") + ":" +
    String(s%60).padStart(2,"0");
  $("status").textContent = canPlay()
    ? "🟢 경기가 진행 중입니다!"
    : s === 0 ? "🏁 경기가 종료되었습니다."
    : "⏸ 교사의 시작 또는 재개를 기다리고 있어요.";
  $("micButton").disabled = !canPlay();
  $("nextButton").disabled = !canPlay();
  if (!canPlay() && requestedListening) stopListening();
  renderTeams();
}
function applyGame(row) {
  if (!row || row.id !== room) return;
  const wasPlaying = canPlay();
  const resetDetected = game &&
    row.time_left === 900 && !row.is_playing &&
    row.team1_chars === 0 && row.team2_chars === 0 &&
    row.team3_chars === 0 &&
    (game.team1_chars || game.team2_chars || game.team3_chars ||
     game.time_left !== 900);
  game = row;
  if (resetDetected) {
    stopListening();
    scoreQueue = [];
    ownChars = 0;
    $("myChars").textContent = "0";
    loadReading();
  }
  renderGame();
  if (wasPlaying && !canPlay()) stopListening();
}
async function fetchGame() {
  const {data,error} = await client.from("game_rooms")
    .select("*").eq("id",room).single();
  if (error) setMessage("서버 연결 오류: " + error.message);
  else applyGame(data);
}
function queueScore(n) {
  if (!canPlay() || n <= 0) return;
  while (n > 0) {
    const part = Math.min(120,n);
    scoreQueue.push(part);
    n -= part;
  }
  flushScore();
}
async function flushScore() {
  if (sendingScore) return;
  sendingScore = true;
  try {
    while (scoreQueue.length && canPlay()) {
      const n = scoreQueue[0];
      const {error} = await client.rpc("rr_add",{
        p_room:room,p_team:team,p_chars:n
      });
      if (error) {
        setMessage("점수 전송 오류: " + error.message);
        break;
      }
      scoreQueue.shift();
    }
  } finally {
    sendingScore = false;
  }
}
function scoreFinalized(text) {
  const n = charCount(text);
  if (!n) return;
  ownChars += n;
  $("myChars").textContent = ownChars;
  queueScore(n);
}
function similarityProgress(target, spoken) {
  const t = normalize(target);
  const h = normalize(spoken);
  if (!t.length || !h.length) return 0;
  let ti = 0;
  for (const ch of h) {
    const found = t.indexOf(ch,ti);
    if (found >= 0 && found - ti <= 4) ti = found + 1;
  }
  return ti / t.length;
}
function maybeAdvance() {
  if (busyAdvance || !canPlay()) return;
  const target = sentences[sentenceIndex];
  if (!target) return;
  const heard = confirmed + interim;
  const ratio = similarityProgress(target,heard);
  if (ratio >= .94 && charCount(heard) >= charCount(target)*.85) {
    busyAdvance = true;
    setTimeout(() => {
      if (canPlay()) nextSentence();
      busyAdvance = false;
    }, 550);
  }
}
function nextSentence() {
  if (sentenceIndex >= sentences.length-1) {
    stopListening();
    setMessage("🎉 이 글을 모두 읽었어요! 다른 글을 선택해 보세요.");
    return;
  }
  const resume = requestedListening;
  stopRecognitionOnly();
  sentenceIndex++;
  confirmed = "";
  interim = "";
  renderSentence();
  if (resume && canPlay()) {
    requestedListening = true;
    startRecognition();
  }
}
function stopRecognitionOnly() {
  activeRecognitionEpoch = ++currentEpoch;
  if (recognition) {
    try { recognition.abort(); } catch(e) {}
    recognition = null;
  }
  listening = false;
}
function stopListening() {
  requestedListening = false;
  stopRecognitionOnly();
  $("micButton").textContent = "🎤 낭독 시작";
}
function startRecognition() {
  if (!requestedListening || !canPlay() || listening) return;
  const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechAPI) {
    setMessage("Chrome 브라우저에서 열어 주세요. 음성 인식을 지원하지 않습니다.");
    stopListening();
    return;
  }
  const rec = new SpeechAPI();
  recognition = rec;
  const epoch = ++currentEpoch;
  activeRecognitionEpoch = epoch;
  rec.lang = "ko-KR";
  rec.continuous = true;
  rec.interimResults = true;
  listening = true;
  let lastFinalIndex = 0;
  rec.onresult = event => {
    if (epoch !== activeRecognitionEpoch) return;
    let temporary = "";
    for (let i = lastFinalIndex; i < event.results.length; i++) {
      const result = event.results[i];
      const text = result[0]?.transcript || "";
      if (result.isFinal) {
        confirmed += text + " ";
        scoreFinalized(text);
        lastFinalIndex = i + 1;
      } else {
        temporary += text + " ";
      }
    }
    interim = temporary;
    renderSentence();
    maybeAdvance();
  };
  rec.onerror = event => {
    if (epoch !== activeRecognitionEpoch) return;
    if (event.error === "not-allowed" ||
        event.error === "service-not-allowed") {
      setMessage("마이크 권한을 허용해 주세요.");
      stopListening();
    } else if (event.error !== "no-speech" &&
               event.error !== "aborted") {
      setMessage("음성 인식 오류: " + event.error);
    }
  };
  rec.onend = () => {
    if (epoch !== activeRecognitionEpoch) return;
    listening = false;
    recognition = null;
    if (requestedListening && canPlay()) {
      setTimeout(() => {
        if (epoch === activeRecognitionEpoch) startRecognition();
      }, 450);
    }
  };
  try {
    rec.start();
    $("micButton").textContent = "⏹ 낭독 멈추기";
    setMessage("");
  } catch(e) {
    listening = false;
    setMessage("마이크 시작 실패: " + e.message);
  }
}

READINGS.forEach((r,i) => {
  const o = document.createElement("option");
  o.value = i;
  o.textContent = r.title;
  $("poemSelect").appendChild(o);
});
$("poemSelect").addEventListener("change",() => {
  stopListening(); loadReading();
});
$("restartButton").onclick = () => {
  stopListening(); loadReading(); setMessage("");
};
$("nextButton").onclick = () => {
  if (canPlay()) nextSentence();
};
$("micButton").onclick = () => {
  if (requestedListening) stopListening();
  else {
    requestedListening = true;
    startRecognition();
  }
};

loadReading();
if (SUPABASE_URL.includes("여기에_") ||
    SUPABASE_KEY.includes("여기에_")) {
  setMessage("코드 상단에 Supabase API URL과 Publishable key를 입력하세요.");
} else {
  fetchGame();
  client.channel("student-" + room + "-" + team + "-" + Math.random())
    .on("postgres_changes",{
      event:"UPDATE",schema:"public",table:"game_rooms",
      filter:"id=eq." + room
    }, payload => applyGame(payload.new))
    .subscribe();
  setInterval(fetchGame,5000);
  setInterval(renderGame,500);
}
</script>
</body>
</html>
