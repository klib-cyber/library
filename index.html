const $ = id => document.getElementById(id);
const GAME_SECONDS = 900;
let running = false;
let deadline = 0;
let timerId = null;
let recognition = null;
let listening = false;
let starting = false;
let micAllowed = true;
let teamSize = 9;
let student = 0;
let poemIndex = 0;
let stanzaIndex = 0;
let poems = [];
let words = [];
let wordIndex = 0;
let totalChars = 0;
let completed = 0;
let advancing = false;
let currentSpeech = "";
let lastProcessedFinal = -1;
function normalize(s) {
return String(s).toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");
}
function shuffle(arr) {
const a = [...arr];
for (let i = a.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[a[i], a[j]] = [a[j], a[i]];
}
return a;
}
function formatTime(s) {
const m = Math.floor(s / 60);
const sec = s % 60;
return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
}
function updateTimer() {
if (!running) return;
const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
$("timer").textContent = "남은 시간 " + formatTime(remaining);
if (remaining === 0) finishGame();
}
function updateScore() {
$("score").textContent = "읽은 글자 수: " + totalChars + "자";
}
function renderStanza() {
if (!running) return;
const poem = poems[poemIndex];
const stanza = poem.stanzas[stanzaIndex];
words = stanza.match(/\S+/g) || [];
wordIndex = 0;
currentSpeech = "";
$("poemTitle").textContent = "📖 " + poem.title + " · " + (stanzaIndex + 1) + "/" + poem.stanzas.length + "연";
$("notice").textContent = "📢 " + (student + 1) + "번 학생이 읽으세요!";
const container = $("text");
container.replaceChildren();
const parts = stanza.split(/(\s+)/);
let idx = 0;
for (const part of parts) {
if (!part) continue;
if (/^\s+$/.test(part)) {
container.appendChild(document.createTextNode(part));
} else {
const span = document.createElement("span");
span.className = "word";
span.textContent = part;
span.dataset.index = idx++;
container.appendChild(span);
}
}
paintWords();
$("status").textContent = "🎤 화면의 문장을 소리 내어 읽어 주세요.";
}
function paintWords() {
const spans = $("text").querySelectorAll(".word");
spans.forEach((span, i) => {
span.className = "word";
if (i < wordIndex) {
span.classList.add("done");
} else if (i === wordIndex) {
span.classList.add("current");
}
});
}
function matches(a, b) {
a = normalize(a);
b = normalize(b);
if (!a || !b) return false;
if (a === b) return true;
if (a.length >= 3 && b.length >= 3) {
return a.includes(b) || b.includes(a);
}
return false;
}
function processSpeech(text) {
if (!running || advancing) return;
const heard = text.match(/\S+/g) || [];
if (!heard.length) return;
for (const spoken of heard) {
if (wordIndex >= words.length) break;
if (matches(words[wordIndex], spoken)) {
totalChars += normalize(words[wordIndex]).length;
wordIndex++;
} else if (wordIndex + 1 < words.length && matches(words[wordIndex + 1], spoken)) {
totalChars += normalize(words[wordIndex]).length;
totalChars += normalize(words[wordIndex + 1]).length;
wordIndex += 2;
}
}
paintWords();
updateScore();
if (words.length && wordIndex >= words.length) {
advanceStanza();
}
}
function setupRecognition() {
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRecognition) {
$("status").textContent = "⚠️ 음성인식 미지원 브라우저입니다. Chrome을 사용하세요.";
return;
}
recognition = new SpeechRecognition();
recognition.lang = "ko-KR";
recognition.continuous = true;
recognition.interimResults = true;
recognition.maxAlternatives = 1;
recognition.onstart = () => {
listening = true;
starting = false;
$("status").textContent = "🎤 마이크 연결됨 · 낭독 중";
};
recognition.onresult = event => {
if (!running || advancing) return;
for (let i = event.resultIndex; i < event.results.length; i++) {
if (event.results[i].isFinal && i > lastProcessedFinal) {
lastProcessedFinal = i;
processSpeech(event.results[i][0].transcript);
}
}
};
recognition.onerror = event => {
listening = false;
starting = false;
if (event.error === "not-allowed" || event.error === "service-not-allowed") {
micAllowed = false;
$("status").textContent = "⚠️ 마이크 권한을 허용해 주세요. 수동 진행도 가능합니다.";
} else if (running) {
$("status").textContent = "⚠️ 음성인식 연결 문제: " + event.error;
}
};
recognition.onend = () => {
listening = false;
starting = false;
lastProcessedFinal = -1;
if (running && micAllowed) {
setTimeout(startListening, 500);
}
};
}
function startListening() {
if (!running || !recognition || !micAllowed || listening || starting) return;
try {
starting = true;
recognition.start();
} catch (e) {
starting = false;
}
}
function stopListening() {
if (!recognition) return;
try { recognition.abort(); } catch (e) {}
listening = false;
starting = false;
}
function startGame() {
if (running) return;
if (!poemDatabase.length) {
alert("읽을 문장이 없습니다.");
return;
}
running = true;
advancing = false;
micAllowed = true;
teamSize = Number($("teamSize").value);
student = 0;
poemIndex = 0;
stanzaIndex = 0;
totalChars = 0;
completed = 0;
poems = shuffle(poemDatabase);
deadline = Date.now() + GAME_SECONDS * 1000;
$("settings").hidden = true;
$("start").hidden = true;
$("next").hidden = false;
$("reset").hidden = false;
$("reading").style.display = "block";
$("result").style.display = "none";
$("track").classList.add("running");
$("runners").style.left = "10px";
updateScore();
renderStanza();
updateTimer();
clearInterval(timerId);
timerId = setInterval(updateTimer, 250);
if (!recognition) setupRecognition();
startListening();
}
function advanceStanza() {
if (!running || advancing) return;
advancing = true;
completed++;
stanzaIndex++;
student = (student + 1) % teamSize;
const allStanzas = poems.reduce((sum, p) => sum + p.stanzas.length, 0);
const ratio = Math.min(1, completed / allStanzas);
const track = $("track");
const runners = $("runners");
const maxLeft = Math.max(10, track.clientWidth - runners.clientWidth - 10);
runners.style.left = (10 + ratio * (maxLeft - 10)) + "px";
setTimeout(() => {
advancing = false;
if (stanzaIndex >= poems[poemIndex].stanzas.length) {
stanzaIndex = 0;
poemIndex++;
}
if (poemIndex >= poems.length) {
finishGame();
} else {
renderStanza();
}
}, 800);
}
function finishGame() {
running = false;
stopListening();
clearInterval(timerId);
$("track").classList.remove("running");
$("reading").style.display = "none";
$("notice").textContent = "🏁 게임이 종료되었습니다!";
const res = $("result");
res.style.display = "block";
res.innerHTML = "🎉 챌린지 완료!

총 읽은 글자 수: " + totalChars + "자";
$("next").hidden = true;
}
window.onload = () => {
$("start").onclick = startGame;
$("next").onclick = advanceStanza;
$("reset").onclick = () => {
running = false;
stopListening();
clearInterval(timerId);
$("settings").hidden = false;
$("start").hidden = false;
$("next").hidden = true;
$("reset").hidden = true;
$("reading").style.display = "none";
$("result").style.display = "none";
$("notice").textContent = "📢 게임을 시작해 주세요!";
$("timer").textContent = "제한시간 15:00";
$("track").classList.remove("running");
$("runners").style.left = "10px";
};
};
